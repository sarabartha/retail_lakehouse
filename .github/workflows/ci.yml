name: Retail CI/CD

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: retail-${{ github.event_name }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  test-in-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t ci
      - run: databricks bundle deploy -t ci
      - run: databricks bundle run -t ci retail_job

  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest


  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Check where this release comes from
        run: |
          if [ "${{ inputs.target }}" = "staging" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Staging releases must run from main."; exit 1
          fi
          if [ "${{ inputs.target }}" = "prod" ] && [[ "${{ github.ref }}" != refs/tags/RTL-v* ]]; then
            echo "Prod releases must run from a version tag like RTL-v1.0.0."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t ${{ inputs.target }}
      - run: databricks bundle deploy -t ${{ inputs.target }}
      - run: databricks bundle run -t ${{ inputs.target }} retail_job