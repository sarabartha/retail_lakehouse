resources:
  pipelines:
    retail_pipeline:
      name: retail_pipeline
      catalog: ${var.catalog}
      schema: ${resources.schemas.retail_schema.name}
      serverless: true
      configuration:
        min_order_date: ${var.min_order_date}
        landing_path: /Volumes/${var.catalog}/${resources.schemas.retail_schema.name}/landing/orders
      libraries:
        - file:
            path: ../src/pipeline/bronze_silver.py
        - file:
            path: ../src/pipeline/gold.sql
