[project]
name = "retail-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyspark>=4.0,<4.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D"]
ignore = ["D100", "D104", "N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/checks"]

