bundle:
  name: retail_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    default: test_catalog
  schema:
    description: Schema for this environment
  min_order_date:
    description: Only orders from this date onwards are loaded

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-7cb97bd5-753f.cloud.databricks.com
    variables:
      schema: retail_dev
      min_order_date: "1998-01-01"

  ci:
    workspace:
      host: https://dbc-7cb97bd5-753f.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/ci
    presets:
      name_prefix: "[ci] "
    variables:
      schema: retail_ci
      min_order_date: "1998-01-01"

  staging:
    workspace:
      host: https://dbc-7cb97bd5-753f.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/staging
    presets:
      name_prefix: "[staging] "
    variables:
      schema: retail_staging
      min_order_date: "1995-01-01"

  prod:
    mode: production
    workspace:
      host: https://dbc-7cb97bd5-753f.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      schema: retail_prod
      min_order_date: "1992-01-01"